[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floorgen"
version = "1.3.0"
description = "Production-grade retrieval-augmented generative vector floorplan synthesis"
readme = "README.md"
authors = [{ name = "FloorGen Team" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Architecture",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "svgwrite>=1.4.3",
    "pydantic>=2.0.0",
    "shapely>=2.0.0",
    "ezdxf>=1.1.0",
    "ortools>=9.8.0",
    "opencv-python>=4.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
demo = ["gradio>=4.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0"
]

[project.scripts]
floorgen = "floorgen.demo.cli:main"
floorgen-api = "floorgen.api.server:main"
